name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      areas:
        description: 'Areas to run: "all", or some of app, install, plugin, service, site (comma separated)'
        default: all
  # Pushes and pull requests only run the jobs their changes need (see "Changes" below). A weekly full run catches
  # what no change in this repository causes: new Minecraft releases, runner images, dependency drift.
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which areas does this change touch? scripts/ci-changes.mjs lists the rules (and scripts/ci-changes.test.ts tries
  # them). Jobs of an area that is untouched are skipped, which counts as passing. Manual and weekly runs, a missing
  # base to compare with, and changes to this workflow run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      install: ${{ steps.scope.outputs.install }}
      site: ${{ steps.scope.outputs.site }}
      plugin: ${{ steps.scope.outputs.plugin }}
      service: ${{ steps.scope.outputs.service }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          AREAS: ${{ inputs.areas }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) node scripts/ci-changes.mjs --base "$PR_BASE" --head "$PR_HEAD" ;;
            push) node scripts/ci-changes.mjs --base "$PUSH_BEFORE" --head "$SHA" ;;
            workflow_dispatch) if [ -z "$AREAS" ] || [ "$AREAS" = all ]; then node scripts/ci-changes.mjs --all; else node scripts/ci-changes.mjs --areas "$AREAS"; fi ;;
            *) node scripts/ci-changes.mjs --all ;;
          esac

  # Typecheck, unit/integration tests and a production build on every OS.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Production HTTPS and WebSocket deployment
        run: pnpm test:deployment

  # The committed /craftpanel plugin jar must match its source.
  plugin:
    name: Info plugin is up to date
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: node scripts/build-info-plugin.mjs --check

  # Full browser flow with a real Minecraft server, on x64 and ARM64 (stand-in for Raspberry Pi).
  e2e:
    name: End-to-end (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - name: An application backup moves a real Paper server to a fresh data directory
        run: bash scripts/real-tests/run.sh 19700 "$RUNNER_TEMP/migration-a" app-migration.mjs "$RUNNER_TEMP/migration-a"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # deploy/install-linux.sh on a real systemd host: install, health check, update path.
  installer:
    name: Linux installer
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # The installer builds as another user via sudo, so there is no store to cache here.
          package-manager-cache: false
      - name: Install as a service
        run: sudo env "PATH=$PATH" ./deploy/install-linux.sh
      - name: Service answers
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/auth/state | grep -q '"setupTokenRequired":true'
          systemctl is-active craftpanel
      - name: Re-running the installer updates and restarts the service
        run: |
          before=$(systemctl show craftpanel -p MainPID --value)
          sudo env "PATH=$PATH" ./deploy/install-linux.sh
          after=$(systemctl show craftpanel -p MainPID --value)
          test "$before" != "$after"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
      - if: failure()
        run: sudo journalctl -u craftpanel --no-pager | tail -100

  # The release package with the one-line installers: install, update in place, uninstall.
  package-linux:
    name: Release package (Linux installer)
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release.mjs pack
      - name: Install from the package
        run: sudo bash release/install.sh --archive release/craftpanel-v*.tar.gz --port 8085
      - name: Service answers
        run: |
          curl -fsS http://127.0.0.1:8085/api/health
          curl -fsS http://127.0.0.1:8085/api/auth/state | grep -q '"setupTokenRequired":true'
          grep -q '"linux-service"' /opt/craftpanel/install.json
      - name: Updating restarts the service and keeps the settings
        run: |
          before=$(systemctl show craftpanel -p MainPID --value)
          sudo /opt/craftpanel/update.sh --archive release/craftpanel-v*.tar.gz
          after=$(systemctl show craftpanel -p MainPID --value)
          test "$before" != "$after"
          grep -q '^CRAFTPANEL_PORT=8085' /etc/craftpanel/craftpanel.env
          curl -fsS http://127.0.0.1:8085/api/health
      - name: Uninstall keeps the data
        run: |
          sudo /opt/craftpanel/update.sh --uninstall
          test ! -e /opt/craftpanel
          sudo test -f /var/lib/craftpanel/craftpanel.db
      - name: Failed migrations and startup artifacts recover in an isolated service
        run: |
          node scripts/real-tests/installer-fixtures.mjs test-results/installer-recovery craftpanel-ops-ci
          sudo env "PATH=$PATH" bash scripts/real-tests/installer-linux.sh test-results/installer-recovery craftpanel-ops-ci 19685
      - if: failure()
        run: sudo journalctl -u craftpanel --no-pager | tail -100

  package-windows:
    name: Release package (Windows installer)
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release.mjs pack
      - name: Install, update and uninstall
        shell: powershell
        run: |
          $env:CRAFTPANEL_ARCHIVE = (Get-Item release\craftpanel-v*.tar.gz).FullName
          $env:CRAFTPANEL_PORT = "8085"
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8085/api/health | Out-Null
          $data = Join-Path $env:LOCALAPPDATA "CraftPanel"
          $before = (Get-Content "$data\control.json" -Raw | ConvertFrom-Json).pid
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\CraftPanel\update.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $after = (Get-Content "$data\control.json" -Raw | ConvertFrom-Json).pid
          if ($before -eq $after) { throw "CraftPanel was not restarted" }
          if (Get-Process -Id $before -ErrorAction SilentlyContinue) { throw "The old CraftPanel is still running" }
          $env:CRAFTPANEL_UNINSTALL = "1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\CraftPanel\update.ps1"
          if (Test-Path "$env:LOCALAPPDATA\Programs\CraftPanel") { throw "Install folder still exists" }
          if (-not (Test-Path "$data\craftpanel.db")) { throw "Data was removed" }
      - if: failure()
        shell: powershell
        run: Get-Content "$env:LOCALAPPDATA\CraftPanel\logs\*.log" -ErrorAction SilentlyContinue
      - name: Failed migrations and hanging startup recover in isolated tasks
        shell: powershell
        run: |
          node scripts/real-tests/installer-fixtures.mjs test-results/installer-recovery
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/real-tests/installer-windows.ps1 -Fixtures test-results/installer-recovery
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real Paper player stays connected; service stop saves and boot start restores it
        shell: powershell
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "mc-tools"
          npm install --prefix $tools --no-audit --no-fund mineflayer@4.39.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/real-tests/runtime-continuity-windows.mjs test-results/installer-recovery $tools
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Scheduled application backup imports into the installed Windows service
        run: node scripts/real-tests/app-migration-service.mjs test-results/installer-recovery

  # The installed Linux service with real Paper servers, as root on a systemd host: every server under its own game
  # account that can't read the panel's secrets, resource limits through cgroup v2 (an out-of-memory stop is reported),
  # and a real player who stays connected while the dashboard restarts and updates. On x64 and ARM64 (stand-in for a
  # Raspberry Pi). Each scenario installs its own throwaway instance (craftpanel-ops-*) and removes it afterwards.
  linux-service:
    name: Linux service, isolation and limits (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.service == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release fixtures
        run: |
          node scripts/real-tests/installer-fixtures.mjs test-results/isolation craftpanel-ops-iso
          node scripts/real-tests/installer-fixtures.mjs test-results/limits craftpanel-ops-lim
          node scripts/real-tests/installer-fixtures.mjs test-results/continuity craftpanel-ops-rt
          node scripts/real-tests/installer-fixtures.mjs test-results/service-migration craftpanel-ops-move
      - name: Host
        run: |
          systemctl --version | head -1
          stat -fc %T /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.controllers
          setpriv --version
      - name: Servers run under their own game accounts and can't read the panel's secrets
        run: sudo env "PATH=$PATH" node scripts/real-tests/isolation.mjs test-results/isolation craftpanel-ops-iso 19686
      - name: Resource limits through cgroup v2, out-of-memory stop reported
        run: sudo env "PATH=$PATH" node scripts/real-tests/limits.mjs test-results/limits craftpanel-ops-lim 19687
      - name: A player stays connected through dashboard restarts and updates
        run: |
          tools="$RUNNER_TEMP/mc-tools"
          npm install --prefix "$tools" --no-audit --no-fund mineflayer@4.39.0
          sudo env "PATH=$PATH" node scripts/real-tests/runtime-continuity.mjs test-results/continuity craftpanel-ops-rt 19689 "$tools"
      - name: Scheduled application backup imports into an installed service with new game accounts
        run: sudo env "PATH=$PATH" node scripts/real-tests/app-migration-service.mjs test-results/service-migration craftpanel-ops-move
      - if: failure()
        run: sudo journalctl --no-pager -u 'craftpanel-ops-*' | tail -200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-service-${{ matrix.os }}
          path: |
            test-results/isolation/*.json
            test-results/limits/*.json
            test-results/continuity/*.log
            test-results/continuity/*.json
            test-results/service-migration/*.json
          if-no-files-found: ignore
          retention-days: 14

  # An existing install of the previous release, with servers that ran as the service account, updated to this build:
  # the servers move to their game accounts with their worlds and files (upgrade-isolation.mjs).
  linux-upgrade:
    name: Linux upgrade from the previous release (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.service == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Servers of the previous release move to game accounts when CraftPanel is updated
        run: |
          prev=v1.0.0
          mkdir -p test-results/previous
          curl -fsSL -o "test-results/previous/craftpanel-$prev.tar.gz" "https://github.com/${{ github.repository }}/releases/download/$prev/craftpanel-$prev.tar.gz"
          node scripts/real-tests/installer-fixtures.mjs test-results/upgrade craftpanel-ops-up --previous "test-results/previous/craftpanel-$prev.tar.gz"
          sudo env "PATH=$PATH" node scripts/real-tests/upgrade-isolation.mjs test-results/upgrade craftpanel-ops-up 19688
      - if: failure()
        run: sudo journalctl --no-pager -u 'craftpanel-ops-*' | tail -200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-upgrade-${{ matrix.os }}
          path: |
            test-results/upgrade/*.json
            test-results/upgrade/*.log
          if-no-files-found: ignore
          retention-days: 14

  # The website: unit tests, production build, and every built page opened at a phone and a desktop width
  # (apps/site/scripts/smoke.mjs: no console errors, no horizontal overflow, scroll reveals fire).
  site:
    name: Website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/site
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:site

  # One check to require in branch protection: skipped areas pass, a failed or cancelled job fails. (Requiring the
  # matrix jobs by name doesn't work once they can be skipped: a skipped matrix job reports without its OS.)
  result:
    name: CI result
    needs: [changes, test, plugin, e2e, installer, package-linux, package-windows, linux-service, linux-upgrade, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
