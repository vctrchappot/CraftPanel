name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck, unit/integration tests and a production build on every OS.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Production HTTPS and WebSocket deployment
        run: pnpm test:deployment

  # The committed /craftpanel plugin jar must match its source.
  plugin:
    name: Info plugin is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: node scripts/build-info-plugin.mjs --check

  # Full browser flow with a real Minecraft server, on x64 and ARM64 (stand-in for Raspberry Pi).
  e2e:
    name: End-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # deploy/install-linux.sh on a real systemd host: install, health check, update path.
  installer:
    name: Linux installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # The installer builds as another user via sudo, so there is no store to cache here.
          package-manager-cache: false
      - name: Install as a service
        run: sudo env "PATH=$PATH" ./deploy/install-linux.sh
      - name: Service answers
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/auth/state | grep -q '"setupTokenRequired":true'
          systemctl is-active craftpanel
      - name: Re-running the installer updates and restarts the service
        run: |
          before=$(systemctl show craftpanel -p MainPID --value)
          sudo env "PATH=$PATH" ./deploy/install-linux.sh
          after=$(systemctl show craftpanel -p MainPID --value)
          test "$before" != "$after"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
      - if: failure()
        run: sudo journalctl -u craftpanel --no-pager | tail -100

  # The release package with the one-line installers: install, update in place, uninstall.
  package-linux:
    name: Release package (Linux installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release.mjs pack
      - name: Install from the package
        run: sudo bash release/install.sh --archive release/craftpanel-v*.tar.gz --port 8085
      - name: Service answers
        run: |
          curl -fsS http://127.0.0.1:8085/api/health
          curl -fsS http://127.0.0.1:8085/api/auth/state | grep -q '"setupTokenRequired":true'
          grep -q '"linux-service"' /opt/craftpanel/install.json
      - name: Updating restarts the service and keeps the settings
        run: |
          before=$(systemctl show craftpanel -p MainPID --value)
          sudo /opt/craftpanel/update.sh --archive release/craftpanel-v*.tar.gz
          after=$(systemctl show craftpanel -p MainPID --value)
          test "$before" != "$after"
          grep -q '^CRAFTPANEL_PORT=8085' /etc/craftpanel/craftpanel.env
          curl -fsS http://127.0.0.1:8085/api/health
      - name: Uninstall keeps the data
        run: |
          sudo /opt/craftpanel/update.sh --uninstall
          test ! -e /opt/craftpanel
          sudo test -f /var/lib/craftpanel/craftpanel.db
      - name: Failed migrations and startup artifacts recover in an isolated service
        run: |
          node scripts/real-tests/installer-fixtures.mjs test-results/installer-recovery craftpanel-ops-ci
          sudo env "PATH=$PATH" bash scripts/real-tests/installer-linux.sh test-results/installer-recovery craftpanel-ops-ci 19685
      - if: failure()
        run: sudo journalctl -u craftpanel --no-pager | tail -100

  package-windows:
    name: Release package (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release.mjs pack
      - name: Install, update and uninstall
        shell: powershell
        run: |
          $env:CRAFTPANEL_ARCHIVE = (Get-Item release\craftpanel-v*.tar.gz).FullName
          $env:CRAFTPANEL_PORT = "8085"
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8085/api/health | Out-Null
          $data = Join-Path $env:LOCALAPPDATA "CraftPanel"
          $before = (Get-Content "$data\control.json" -Raw | ConvertFrom-Json).pid
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\CraftPanel\update.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $after = (Get-Content "$data\control.json" -Raw | ConvertFrom-Json).pid
          if ($before -eq $after) { throw "CraftPanel was not restarted" }
          if (Get-Process -Id $before -ErrorAction SilentlyContinue) { throw "The old CraftPanel is still running" }
          $env:CRAFTPANEL_UNINSTALL = "1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\CraftPanel\update.ps1"
          if (Test-Path "$env:LOCALAPPDATA\Programs\CraftPanel") { throw "Install folder still exists" }
          if (-not (Test-Path "$data\craftpanel.db")) { throw "Data was removed" }
      - if: failure()
        shell: powershell
        run: Get-Content "$env:LOCALAPPDATA\CraftPanel\logs\*.log" -ErrorAction SilentlyContinue
      - name: Failed migrations and hanging startup recover in isolated tasks
        shell: powershell
        run: |
          node scripts/real-tests/installer-fixtures.mjs test-results/installer-recovery
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/real-tests/installer-windows.ps1 -Fixtures test-results/installer-recovery
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real Paper player stays connected; service stop saves and boot start restores it
        shell: powershell
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "mc-tools"
          npm install --prefix $tools --no-audit --no-fund mineflayer@4.39.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/real-tests/runtime-continuity-windows.mjs test-results/installer-recovery $tools
          if ($LASTEXITCODE -ne 0) { exit 1 }
