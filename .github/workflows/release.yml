name: Release

# Publishes a GitHub release when a version tag is pushed (policy: docs/RELEASING.md):
#   node scripts/release.mjs bump 1.2.0 && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

# One publication per tag; a second push of the same tag waits instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version, changelog and tag are consistent
        run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME"
      # The bump commit changes every workspace manifest, so its CI run covers the app, the installers, the service
      # scenarios and the website. Publish only after that run of exactly this commit has passed.
      - name: The tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          for i in $(seq 1 200); do
            run=$(gh run list --workflow ci.yml --commit "$sha" --event push --limit 1 --json databaseId,status,conclusion --jq '.[0] | select(.) | "\(.databaseId) \(.status) \(.conclusion)"')
            set -- $run
            if [ "${2:-}" = completed ]; then
              [ "$3" = success ] && { echo "CI run $1 passed for $sha"; exit 0; }
              echo "::error::CI run $1 for $sha ended with $3. Fix it (or re-run it) and re-run this workflow; nothing was published."
              exit 1
            fi
            echo "Waiting for CI on $sha (${run:-not started})"
            sleep 60
          done
          echo "::error::No finished CI run for $sha after 200 minutes"
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/release.mjs pack
      - name: Smoke test the package
        run: |
          mkdir /tmp/smoke && tar -xzf release/craftpanel-$GITHUB_REF_NAME.tar.gz -C /tmp/smoke
          cd /tmp/smoke/craftpanel-$GITHUB_REF_NAME
          CRAFTPANEL_DATA_DIR=/tmp/smoke/data node apps/api/dist/runtime.js &
          CRAFTPANEL_DATA_DIR=/tmp/smoke/data CRAFTPANEL_PORT=8090 node apps/api/dist/index.js &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/ | grep -q CraftPanel
      - name: Release notes
        run: |
          node scripts/release.mjs notes > release/NOTES.md
          cat >> release/NOTES.md <<NOTES

          ## Install or update

          **Linux / Raspberry Pi** (systemd): \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sudo bash\`

          **Windows** (PowerShell): \`irm https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex\`

          Already installed: run the same command again, or the update command shown in Settings → Security & about. Servers, worlds and backups are kept.
          NOTES
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --title "CraftPanel $GITHUB_REF_NAME" --notes-file release/NOTES.md $prerelease \
            release/craftpanel-$GITHUB_REF_NAME.tar.gz release/install.sh release/install.ps1 release/release.json release/SHA256SUMS
